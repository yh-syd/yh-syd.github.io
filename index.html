<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WL1L4KDWQN"></script>
<script>

function gtag() { dataLayer.push(arguments); }

gtag("config", "G-WL1L4KDWQN");

<title>Water Words</title>
<meta name="description" content="A wall of words that moves like water. Grab a word, drag it through the others, and make it burst.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<style>
:root { --bg: #111518; --surface: #1b2126; --fg: #e5e9ec; --muted: #98a3ab; --line: #2c353c; --accent: #5dbfc8; --ink: .58; --r: 170px; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  overflow: hidden; touch-action: none; user-select: none; color: var(--fg);
  font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  background: radial-gradient(900px 560px at 8% -12%, #19283f, transparent 62%), radial-gradient(760px 480px at 104% 6%, #15373c, transparent 60%), var(--bg);
}
#wall, #glow, #light { position: fixed; left: 0; top: 0; pointer-events: none; }
#wall { right: 0; bottom: 0; opacity: var(--ink); }
#wall canvas { position: absolute; width: 100%; height: 100%; }
#glow { width: calc(var(--r) * 2.6); height: calc(var(--r) * 2.6); background: radial-gradient(closest-side, rgba(63, 169, 255, .1), transparent 70%); }
#light {
  width: calc(var(--r) * 2); height: calc(var(--r) * 2); backdrop-filter: brightness(1.7) saturate(1.6);
  mask-image: radial-gradient(closest-side, #000, rgba(0, 0, 0, .55) 45%, transparent);
}
#meter {
  --heat: hsl(calc(45 - 40 * var(--p)) 90% 60%);
  position: fixed; top: 36px; left: 50%; translate: -50% 0; width: min(420px, calc(100vw - 180px)); height: 16px; border-radius: 8px; pointer-events: none;
  border: 1px solid rgba(255, 255, 255, .45); box-shadow: 0 0 calc(6px + 22px * var(--p)) var(--heat), 0 2px 12px rgba(0, 0, 0, .6);
  background: linear-gradient(90deg, var(--heat) calc(var(--p) * 100%), rgba(17, 21, 24, .85) 0);
}
#meter::before { content: "power"; position: absolute; left: 0; bottom: calc(100% + 4px); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
#error { position: fixed; left: 16px; bottom: 14px; margin: 0; color: #f38ba8; font-size: 12px; }
#menu { position: fixed; top: 16px; right: 16px; touch-action: auto; }
#menu summary {
  list-style: none; width: max-content; margin-left: auto; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  font-weight: 600; color: var(--bg); background: var(--accent); box-shadow: 0 0 18px rgba(93, 191, 200, .5);
}
#menu summary::-webkit-details-marker { display: none; }
#menu summary:hover, #menu[open] summary { filter: brightness(1.15); }
#panel {
  position: absolute; top: 46px; right: 0; width: min(300px, calc(100vw - 32px)); max-height: calc(100dvh - 76px); overflow: auto;
  display: grid; gap: 10px; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(27, 33, 38, .88); backdrop-filter: blur(12px); box-shadow: 0 18px 40px -16px #000;
}
.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.slider { display: grid; grid-template-columns: 1fr auto; }
.slider b { color: var(--accent); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; }
input { accent-color: var(--accent); }
#foot { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 0; }
button { font: inherit; font-weight: 600; padding: 5px 10px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: none; color: var(--fg); }
button:hover { border-color: var(--accent); }
a { color: var(--accent); font-size: 12px; }
</style>
</head>
<body>
<div id="glow"></div>
<div id="wall"></div>
<div id="light"></div>
<div id="meter" hidden></div>
<p id="error" hidden></p>
<details id="menu">
  <summary>⚙ settings</summary>
  <div id="panel"><p id="foot"><button id="reset" type="button">reset</button><a href="https://github.com/yh-syd/yh-syd.github.io">source</a></p></div>
</details>
<script src="water.js"></script>
</body>
</html>
